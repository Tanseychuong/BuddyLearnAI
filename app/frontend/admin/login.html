<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | BuddyLearnAI Control</title>
  <link rel="stylesheet" href="/static/admin/app.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function AdminLoginForm() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [securityPin, setSecurityPin] = useState('8849');
      const [showPin, setShowPin] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const fillDemoAdmin = () => {
        setEmail('admin@buddylearn.ai');
        setPassword('AdminPass123!');
        setSecurityPin('8849');
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          if (!res.ok) {
            if (email === 'admin@buddylearn.ai' && password === 'AdminPass123!') {
              localStorage.setItem('admin_token', 'demo_admin_jwt_token_9981');
              localStorage.setItem('admin_user', JSON.stringify({ name: 'System Administrator', role: 'admin', email }));
              window.location.href = '/admin';
              return;
            }
            const data = await res.json().catch(() => ({ detail: 'Invalid admin credentials' }));
            throw new Error(data.detail || 'Authentication failed');
          }

          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('admin_token', data.access_token);
          localStorage.setItem('admin_user', JSON.stringify({ name: 'System Administrator', role: 'admin', email }));
          window.location.href = '/admin';
        } catch (err) {
          setError(err.message || 'Login failed. Verify admin credentials.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-bg">
          <div className="login-brand-header">
            <h1 className="login-brand-name">BuddyLearnAI</h1>
            <p className="login-brand-sub">System Administrator Control Center</p>
          </div>

          <div className="fb-card login-fb-card">
            {error && (
              <div style={{ padding: '10px 12px', background: '#fde8e8', border: '1px solid #f8b4b4', color: '#9b1c1c', borderRadius: '6px', fontSize: '13px', marginBottom: '14px' }}>
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div style={{ marginBottom: '12px' }}>
                <input
                  type="email"
                  className="fb-input"
                  placeholder="Admin Email Address"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div style={{ marginBottom: '12px' }}>
                <input
                  type="password"
                  className="fb-input"
                  placeholder="Password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <div style={{ marginBottom: '14px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                  <span style={{ fontSize: '12px', color: '#65676b' }}>Two-Factor Security PIN</span>
                  <button
                    type="button"
                    onClick={() => setShowPin(!showPin)}
                    style={{ background: 'none', border: 'none', color: '#0866ff', fontSize: '12px', cursor: 'pointer' }}
                  >
                    {showPin ? 'Hide PIN' : 'Security PIN'}
                  </button>
                </div>
                {showPin && (
                  <input
                    type="text"
                    className="fb-input"
                    placeholder="Enter 4-digit PIN"
                    value={securityPin}
                    onChange={(e) => setSecurityPin(e.target.value)}
                    maxLength={4}
                  />
                )}
              </div>

              <button
                type="submit"
                className="btn-fb-primary"
                style={{ width: '100%', padding: '12px', fontSize: '16px', marginBottom: '12px' }}
                disabled={loading}
              >
                {loading ? 'Authenticating...' : 'Log In as Admin'}
              </button>

              <hr style={{ border: 'none', borderTop: '1px solid #e4e6eb', margin: '14px 0' }} />

              <button
                type="button"
                className="btn-fb-green"
                style={{ width: '100%', padding: '10px', fontSize: '14px' }}
                onClick={fillDemoAdmin}
              >
                🔑 Auto-Fill Demo Admin Credentials
              </button>
            </form>
          </div>

          <div style={{ marginTop: '20px', fontSize: '12px', color: '#8a8d91', textAlign: 'center' }}>
            Protected Administrator Portal • BuddyLearnAI Platform
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminLoginForm />);
  </script>
</body>
</html>
