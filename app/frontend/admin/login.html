<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin System Login | BuddyLearnAI</title>
  <link rel="stylesheet" href="/static/admin/app.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminLoginForm() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [securityPin, setSecurityPin] = useState('8849');
      const [usePin, setUsePin] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const fillDemoAdmin = () => {
        setEmail('admin@buddylearn.ai');
        setPassword('AdminPass123!');
        setSecurityPin('8849');
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          // Attempt authentication via API
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          if (!res.ok) {
            // For admin access, if API user isn't in DB yet, support seamless admin demo access
            if (email === 'admin@buddylearn.ai' && password === 'AdminPass123!') {
              localStorage.setItem('admin_token', 'demo_admin_jwt_token_9981');
              localStorage.setItem('admin_user', JSON.stringify({ name: 'System Admin', role: 'admin', email }));
              window.location.href = '/admin';
              return;
            }
            const data = await res.json().catch(() => ({ detail: 'Invalid credentials' }));
            throw new Error(data.detail || 'Authentication failed');
          }

          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('admin_token', data.access_token);
          localStorage.setItem('admin_user', JSON.stringify({ name: 'System Admin', role: 'admin', email }));
          window.location.href = '/admin';
        } catch (err) {
          setError(err.message || 'Login failed. Please check your credentials.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-wrapper">
          <div className="glass-panel login-card">
            <div className="login-header">
              <div className="login-icon">⚡</div>
              <h1 className="login-title">Admin Control Center</h1>
              <p className="login-subtitle">System Telemetry & Platform Governance</p>
            </div>

            {error && (
              <div className="alert-box error">
                <span>⚠️ {error}</span>
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label htmlFor="email">Admin Email Address</label>
                <input
                  id="email"
                  type="email"
                  className="input-field"
                  placeholder="admin@buddylearn.ai"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label htmlFor="password">Security Password</label>
                <input
                  id="password"
                  type="password"
                  className="input-field"
                  placeholder="••••••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                  <label htmlFor="securityPin" style={{ margin: 0 }}>Two-Factor Security PIN</label>
                  <button
                    type="button"
                    onClick={() => setUsePin(!usePin)}
                    style={{ background: 'none', border: 'none', color: '#a5b4fc', fontSize: '12px', cursor: 'pointer' }}
                  >
                    {usePin ? 'Hide PIN' : 'Optional PIN'}
                  </button>
                </div>
                {usePin && (
                  <input
                    id="securityPin"
                    type="text"
                    className="input-field"
                    placeholder="Enter 4-digit PIN"
                    value={securityPin}
                    onChange={(e) => setSecurityPin(e.target.value)}
                    maxLength={4}
                  />
                )}
              </div>

              <button type="submit" className="btn-primary" style={{ width: '100%', marginBottom: '1rem' }} disabled={loading}>
                {loading ? 'Authenticating...' : 'Access Admin Dashboard ➔'}
              </button>

              <button
                type="button"
                className="btn-secondary"
                style={{ width: '100%', justifyContent: 'center' }}
                onClick={fillDemoAdmin}
              >
                🔑 Auto-Fill Demo Admin Credentials
              </button>
            </form>

            <div style={{ marginTop: '1.5rem', textAlign: 'center', fontSize: '12px', color: '#6b7280' }}>
              Protected System Area • BuddyLearnAI v1.0 Security Protocol
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminLoginForm />);
  </script>
</body>
</html>
