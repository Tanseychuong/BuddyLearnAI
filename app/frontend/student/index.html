<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Workspace | BuddyLearnAI</title>
  <link rel="stylesheet" href="/static/student/styles.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function StudentWorkspace() {
      const [activeTab, setActiveTab] = useState('feed');
      const [activeCourseId, setActiveCourseId] = useState(1);
      const [uploading, setUploading] = useState(false);
      const [uploadStatus, setUploadStatus] = useState('');
      
      const [materials, setMaterials] = useState([
        { id: 1, name: 'Algorithm_Design_Ch4.pdf', course: 'CS312 Algorithm Analysis', date: '2026-03-10', status: 'Ready' },
        { id: 2, name: 'Dynamic_Programming_Lecture_Notes.pptx', course: 'CS312 Algorithm Analysis', date: '2026-03-12', status: 'Ready' },
      ]);

      const [selectedTool, setSelectedTool] = useState('quiz');
      const [currentQuizStep, setCurrentQuizStep] = useState(0);
      const [selectedOptions, setSelectedOptions] = useState({});
      const [quizFinished, setQuizFinished] = useState(false);

      const quizData = [
        {
          id: 1,
          prompt: "What is the key difference between Memoization and Tabulation in Dynamic Programming?",
          options: [
            "Memoization is top-down (recursive) while Tabulation is bottom-up (iterative)",
            "Memoization uses O(N²) extra space while Tabulation uses O(1)",
            "Memoization only applies to graph algorithms",
            "Tabulation cannot solve overlapping subproblems"
          ],
          correctIdx: 0,
          explanation: "Memoization caches top-down recursive calls, whereas Tabulation builds a table iteratively."
        },
        {
          id: 2,
          prompt: "What is the optimal substructure property?",
          options: [
            "A problem has optimal substructure if an optimal solution contains optimal solutions to subproblems",
            "All subproblems can be solved in linear O(N) time",
            "The graph contains no negative weight cycles",
            "Memory can be dynamically reallocated during execution"
          ],
          correctIdx: 0,
          explanation: "Optimal substructure allows building global optimal solutions from optimal subproblem solutions."
        }
      ];

      const flashcards = [
        { id: 1, front: "What is Dynamic Programming?", back: "A method for solving complex problems by breaking them into overlapping subproblems and storing intermediate results." },
        { id: 2, front: "Define Memoization.", back: "A top-down optimization technique that caches function return values based on input parameters." },
        { id: 3, front: "What is Dijkstra's Algorithm complexity with a Min-Heap?", back: "O((V + E) log V), where V is vertices and E is edges." }
      ];
      const [flashcardIdx, setFlashcardIdx] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const examTopics = [
        { topic: 'Graph Shortest Paths', weight: '34%' },
        { topic: 'Dynamic Programming Recurrences', weight: '26%' },
        { topic: 'Binary Search Trees & AVL Rotations', weight: '15%' }
      ];

      const handleFileUpload = async (e) => {
        e.preventDefault();
        const fileInput = e.target.elements.file;
        if (!fileInput.files || fileInput.files.length === 0) return;

        const file = fileInput.files[0];
        setUploading(true);

        const formData = new FormData();
        formData.append('course_id', activeCourseId);
        formData.append('file', file);

        try {
          await fetch('/uploads', { method: 'POST', body: formData });
        } catch (e) {}

        setMaterials([{ id: Date.now(), name: file.name, course: 'CS312 Algorithm Analysis', date: 'Just now', status: 'Ready' }, ...materials]);
        setUploadStatus(`✔ ${file.name} uploaded to course feed.`);
        setUploading(false);
        fileInput.value = '';
      };

      const selectOption = (optIdx) => {
        setSelectedOptions({ ...selectedOptions, [currentQuizStep]: optIdx });
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* FB Header Navbar */}
          <header className="fb-header">
            <div className="brand-section">
              <div className="fb-logo-mark">b</div>
              <span className="brand-title-text">BuddyLearnAI</span>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <select 
                className="fb-input" 
                style={{ width: '220px' }}
                value={activeCourseId}
                onChange={(e) => setActiveCourseId(Number(e.target.value))}
              >
                <option value={1}>CS312 Algorithm Analysis</option>
                <option value={2}>MATH201 Linear Algebra</option>
                <option value={3}>CS221 Data Structures</option>
              </select>

              <span style={{ fontSize: '13px', fontWeight: 600, color: '#050505' }}>
                👤 Ama Owusu (Student)
              </span>

              <a href="/student/login" className="btn-fb-secondary">🔒 Log Out</a>
            </div>
          </header>

          {/* 3-Column Layout */}
          <main className="fb-feed-layout">
            {/* Left Sidebar */}
            <aside className="left-sidebar">
              <div className="fb-card" style={{ padding: '8px' }}>
                <button 
                  className={`sidebar-nav-item ${activeTab === 'feed' ? 'active' : ''}`}
                  onClick={() => setActiveTab('feed')}
                >
                  📌 Study Feed & AI Tools
                </button>

                <button 
                  className={`sidebar-nav-item ${activeTab === 'materials' ? 'active' : ''}`}
                  onClick={() => setActiveTab('materials')}
                >
                  📂 Course Documents ({materials.length})
                </button>
              </div>
            </aside>

            {/* Middle Content Feed */}
            <section className="feed-content">
              {/* Post Upload Card */}
              <div className="fb-card create-post-card">
                <h3 style={{ fontSize: '15px', fontWeight: 700, marginBottom: '8px' }}>Upload Course Material to Feed</h3>
                <form onSubmit={handleFileUpload}>
                  <label className="file-drop-area" style={{ display: 'block' }}>
                    <input type="file" name="file" style={{ display: 'none' }} onChange={(e) => {
                      if (e.target.files.length > 0) {
                        handleFileUpload({ preventDefault: () => {}, target: e.target.form });
                      }
                    }} />
                    <div style={{ fontSize: '24px', marginBottom: '4px' }}>📁</div>
                    <strong style={{ fontSize: '14px', display: 'block' }}>Click or drag PDF / PPTX slides here</strong>
                  </label>
                </form>

                {uploadStatus && (
                  <div style={{ marginTop: '10px', fontSize: '13px', color: '#137333', fontWeight: 600 }}>
                    {uploadStatus}
                  </div>
                )}
              </div>

              {/* Study Tool Selector Tabs */}
              <div className="fb-card" style={{ padding: '12px' }}>
                <div style={{ display: 'flex', gap: '8px', marginBottom: '14px' }}>
                  <button 
                    className={`btn-fb-${selectedTool === 'quiz' ? 'primary' : 'secondary'}`}
                    onClick={() => setSelectedTool('quiz')}
                  >
                    ❓ Practice Quiz Player
                  </button>

                  <button 
                    className={`btn-fb-${selectedTool === 'flashcards' ? 'primary' : 'secondary'}`}
                    onClick={() => setSelectedTool('flashcards')}
                  >
                    🗂 3D Study Flashcards
                  </button>

                  <button 
                    className={`btn-fb-${selectedTool === 'guide' ? 'primary' : 'secondary'}`}
                    onClick={() => setSelectedTool('guide')}
                  >
                    📘 Study Guide Summary
                  </button>
                </div>

                {/* Tool 1: Interactive Quiz Player */}
                {selectedTool === 'quiz' && (
                  <div>
                    {!quizFinished ? (
                      <div>
                        <div style={{ fontSize: '13px', color: '#65676b', marginBottom: '8px' }}>
                          Question {currentQuizStep + 1} of {quizData.length}
                        </div>
                        <h4 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '14px' }}>
                          {quizData[currentQuizStep].prompt}
                        </h4>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '16px' }}>
                          {quizData[currentQuizStep].options.map((opt, idx) => (
                            <button
                              key={idx}
                              style={{
                                width: '100%',
                                padding: '10px 14px',
                                textAlign: 'left',
                                background: selectedOptions[currentQuizStep] === idx ? '#e7f3ff' : '#f0f2f5',
                                border: selectedOptions[currentQuizStep] === idx ? '1px solid #0866ff' : '1px solid #e4e6eb',
                                borderRadius: '6px',
                                fontSize: '14px',
                                fontWeight: selectedOptions[currentQuizStep] === idx ? 600 : 400,
                                cursor: 'pointer'
                              }}
                              onClick={() => selectOption(idx)}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                          <button
                            className="btn-fb-secondary"
                            disabled={currentQuizStep === 0}
                            onClick={() => setCurrentQuizStep(currentQuizStep - 1)}
                          >
                            ← Previous
                          </button>

                          {currentQuizStep < quizData.length - 1 ? (
                            <button
                              className="btn-fb-primary"
                              onClick={() => setCurrentQuizStep(currentQuizStep + 1)}
                            >
                              Next →
                            </button>
                          ) : (
                            <button className="btn-fb-primary" onClick={() => setQuizFinished(true)}>
                              Submit Quiz 🏆
                            </button>
                          )}
                        </div>
                      </div>
                    ) : (
                      <div style={{ textAlign: 'center', padding: '16px 0' }}>
                        <h3 style={{ fontSize: '18px', fontWeight: 700 }}>Quiz Finished!</h3>
                        <p style={{ fontSize: '14px', color: '#65676b', margin: '8px 0 16px' }}>Great effort on practice set 1!</p>
                        <button className="btn-fb-primary" onClick={() => { setQuizFinished(false); setCurrentQuizStep(0); setSelectedOptions({}); }}>
                          🔄 Try Again
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* Tool 2: 3D Flashcards */}
                {selectedTool === 'flashcards' && (
                  <div>
                    <div style={{ textAlign: 'center', fontSize: '12px', color: '#65676b', marginBottom: '8px' }}>
                      Click card to flip • Card {flashcardIdx + 1} of {flashcards.length}
                    </div>

                    <div 
                      className={`flashcard-wrapper ${isFlipped ? 'flipped' : ''}`}
                      onClick={() => setIsFlipped(!isFlipped)}
                    >
                      <div className="flashcard-inner">
                        <div className="flashcard-face flashcard-front">
                          <span style={{ fontSize: '11px', color: '#0866ff', textTransform: 'uppercase', fontWeight: 700, marginBottom: '8px' }}>
                            Question
                          </span>
                          <h4 style={{ fontSize: '16px', fontWeight: 600 }}>{flashcards[flashcardIdx].front}</h4>
                          <span style={{ fontSize: '12px', color: '#65676b', marginTop: '12px' }}>↻ Click to flip</span>
                        </div>

                        <div className="flashcard-face flashcard-back">
                          <span style={{ fontSize: '11px', color: '#42b72a', textTransform: 'uppercase', fontWeight: 700, marginBottom: '8px' }}>
                            Explanation
                          </span>
                          <p style={{ fontSize: '14px', lineHeight: '1.5' }}>{flashcards[flashcardIdx].back}</p>
                        </div>
                      </div>
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'center', gap: '10px' }}>
                      <button
                        className="btn-fb-secondary"
                        disabled={flashcardIdx === 0}
                        onClick={() => { setIsFlipped(false); setFlashcardIdx(flashcardIdx - 1); }}
                      >
                        ← Previous
                      </button>

                      <button
                        className="btn-fb-primary"
                        disabled={flashcardIdx === flashcards.length - 1}
                        onClick={() => { setIsFlipped(false); setFlashcardIdx(flashcardIdx + 1); }}
                      >
                        Next Card →
                      </button>
                    </div>
                  </div>
                )}

                {/* Tool 3: Study Guide */}
                {selectedTool === 'guide' && (
                  <div style={{ padding: '10px 0' }}>
                    <h4 style={{ fontSize: '16px', fontWeight: 700, color: '#0866ff', marginBottom: '8px' }}>
                      📘 Dynamic Programming Chapter Summary
                    </h4>
                    <p style={{ fontSize: '13px', color: '#050505', lineHeight: '1.6' }}>
                      Dynamic Programming optimizes recursive algorithms by caching overlapping subproblem results.
                      Top-Down (Memoization) uses recursion + lookup table. Bottom-Up (Tabulation) computes base cases first.
                    </p>
                  </div>
                )}
              </div>
            </section>

            {/* Right Widget Column */}
            <aside style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div className="fb-card" style={{ padding: '16px' }}>
                <h4 style={{ fontSize: '14px', fontWeight: 700, marginBottom: '10px' }}>Exam Readiness Gauge</h4>
                <div style={{ width: '100px', height: '100px', borderRadius: '50%', background: '#e7f3ff', border: '6px solid #0866ff', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 10px' }}>
                  <span style={{ fontSize: '24px', fontWeight: 800, color: '#0866ff' }}>82%</span>
                </div>
                <div style={{ textAlign: 'center', fontSize: '12px', color: '#65676b' }}>High Exam Readiness</div>
              </div>

              <div className="fb-card" style={{ padding: '16px' }}>
                <h4 style={{ fontSize: '14px', fontWeight: 700, marginBottom: '10px' }}>Past Exam Topic Weights</h4>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  {examTopics.map((item, idx) => (
                    <div key={idx} style={{ fontSize: '13px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '2px' }}>
                        <span>{item.topic}</span>
                        <strong>{item.weight}</strong>
                      </div>
                      <div style={{ height: '6px', background: '#e4e6eb', borderRadius: '3px', overflow: 'hidden' }}>
                        <div style={{ width: item.weight, height: '100%', background: '#0866ff' }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </aside>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudentWorkspace />);
  </script>
</body>
</html>
