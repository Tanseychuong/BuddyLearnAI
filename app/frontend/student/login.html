<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login & Sign Up | BuddyLearnAI</title>
  <link rel="stylesheet" href="/static/student/styles.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function StudentAuthApp() {
      const [isRegister, setIsRegister] = useState(false);
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const fillDemoStudent = () => {
        setEmail('student@ashesi.edu.gh');
        setPassword('StudentPass123!');
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setSuccessMsg('');
        setLoading(true);

        const endpoint = isRegister ? '/auth/register' : '/auth/login';
        const payload = isRegister ? { email, password, full_name: fullName } : { email, password };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            if (!isRegister && email === 'student@ashesi.edu.gh' && password === 'StudentPass123!') {
              localStorage.setItem('student_token', 'demo_student_jwt_token_7712');
              localStorage.setItem('student_user', JSON.stringify({ name: 'Ama Owusu', role: 'student', email }));
              window.location.href = '/student';
              return;
            }
            const data = await res.json().catch(() => ({ detail: 'Authentication failed' }));
            throw new Error(data.detail || 'Request failed');
          }

          const data = await res.json();
          if (isRegister) {
            setSuccessMsg('Account created! Please log in.');
            setIsRegister(false);
          } else {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('student_token', data.access_token);
            localStorage.setItem('student_user', JSON.stringify({ name: fullName || 'Student User', role: 'student', email }));
            window.location.href = '/student';
          }
        } catch (err) {
          setError(err.message || 'Login failed. Verify credentials.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-bg">
          <div style={{ textAlign: 'center', marginBottom: '24px' }}>
            <h1 style={{ fontSize: '36px', fontWeight: 800, color: '#0866ff', letterSpacing: '-0.5px' }}>
              BuddyLearnAI
            </h1>
            <p style={{ fontSize: '16px', color: '#65676b' }}>Personalized AI Learning Companion</p>
          </div>

          <div className="fb-card" style={{ width: '100%', maxWidth: '396px', padding: '20px' }}>
            {error && (
              <div style={{ padding: '10px 12px', background: '#fde8e8', border: '1px solid #f8b4b4', color: '#9b1c1c', borderRadius: '6px', fontSize: '13px', marginBottom: '14px' }}>
                ⚠️ {error}
              </div>
            )}

            {successMsg && (
              <div style={{ padding: '10px 12px', background: '#e6f4ea', color: '#137333', borderRadius: '6px', fontSize: '13px', marginBottom: '14px' }}>
                ✔ {successMsg}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              {isRegister && (
                <div style={{ marginBottom: '12px' }}>
                  <input
                    type="text"
                    className="fb-input"
                    placeholder="Full Name"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    required
                  />
                </div>
              )}

              <div style={{ marginBottom: '12px' }}>
                <input
                  type="email"
                  className="fb-input"
                  placeholder="Student Email Address"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div style={{ marginBottom: '14px' }}>
                <input
                  type="password"
                  className="fb-input"
                  placeholder="Password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <button
                type="submit"
                className="btn-fb-primary"
                style={{ width: '100%', padding: '12px', fontSize: '16px', marginBottom: '12px' }}
                disabled={loading}
              >
                {loading ? 'Processing...' : isRegister ? 'Create Account' : 'Log In'}
              </button>

              {!isRegister && (
                <button
                  type="button"
                  className="btn-fb-secondary"
                  style={{ width: '100%', padding: '10px', fontSize: '14px', justifyContent: 'center', marginBottom: '12px' }}
                  onClick={fillDemoStudent}
                >
                  🔑 Auto-Fill Demo Student Credentials
                </button>
              )}

              <hr style={{ border: 'none', borderTop: '1px solid #e4e6eb', margin: '14px 0' }} />

              <div style={{ textAlign: 'center' }}>
                <button
                  type="button"
                  style={{ background: '#42b72a', color: '#fff', border: 'none', padding: '10px 16px', borderRadius: '6px', fontWeight: 600, cursor: 'pointer', fontSize: '14px' }}
                  onClick={() => { setIsRegister(!isRegister); setError(''); setSuccessMsg(''); }}
                >
                  {isRegister ? 'Already have an account? Log In' : 'Create New Account'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudentAuthApp />);
  </script>
</body>
</html>
