<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login & Register | BuddyLearnAI</title>
  <link rel="stylesheet" href="/static/student/styles.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function StudentAuthApp() {
      const [isRegister, setIsRegister] = useState(false);
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const fillDemoStudent = () => {
        setEmail('student@ashesi.edu.gh');
        setPassword('StudentPass123!');
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setSuccessMsg('');
        setLoading(true);

        const endpoint = isRegister ? '/auth/register' : '/auth/login';
        const payload = isRegister ? { email, password, full_name: fullName } : { email, password };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            if (!isRegister && email === 'student@ashesi.edu.gh' && password === 'StudentPass123!') {
              localStorage.setItem('student_token', 'demo_student_jwt_token_7712');
              localStorage.setItem('student_user', JSON.stringify({ name: 'Ama Owusu', role: 'student', email }));
              window.location.href = '/student';
              return;
            }
            const data = await res.json().catch(() => ({ detail: 'Authentication failed' }));
            throw new Error(data.detail || 'Request failed');
          }

          const data = await res.json();
          if (isRegister) {
            setSuccessMsg('Account created successfully! Logging you in...');
            setTimeout(() => {
              setIsRegister(false);
            }, 1200);
          } else {
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('student_token', data.access_token);
            localStorage.setItem('student_user', JSON.stringify({ name: fullName || 'Student User', role: 'student', email }));
            window.location.href = '/student';
          }
        } catch (err) {
          setError(err.message || 'Login failed. Please verify credentials.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-wrapper">
          <div className="glass-panel login-card">
            <div className="login-header">
              <div className="login-icon">🧠</div>
              <h1 style={{ fontFamily: 'Outfit, sans-serif', fontSize: '24px', fontWeight: 800, marginBottom: '6px' }}>
                {isRegister ? 'Create Student Account' : 'Log In to BuddyLearnAI'}
              </h1>
              <p style={{ fontSize: '14px', color: '#94a3b8' }}>Personalized AI Study Workspace</p>
            </div>

            {error && (
              <div style={{ padding: '10px 14px', borderRadius: '8px', background: 'rgba(244, 63, 94, 0.15)', border: '1px solid rgba(244, 63, 94, 0.3)', color: '#fca5a5', fontSize: '13px', marginBottom: '1rem' }}>
                ⚠️ {error}
              </div>
            )}

            {successMsg && (
              <div style={{ padding: '10px 14px', borderRadius: '8px', background: 'rgba(16, 185, 129, 0.15)', border: '1px solid rgba(16, 185, 129, 0.3)', color: '#6ee7b7', fontSize: '13px', marginBottom: '1rem' }}>
                ✔ {successMsg}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              {isRegister && (
                <div className="form-group">
                  <label htmlFor="fullName">Full Name</label>
                  <input
                    id="fullName"
                    type="text"
                    className="input-field"
                    placeholder="Ama Owusu"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    required
                  />
                </div>
              )}

              <div className="form-group">
                <label htmlFor="email">Student Email</label>
                <input
                  id="email"
                  type="email"
                  className="input-field"
                  placeholder="student@ashesi.edu.gh"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                  <label htmlFor="password" style={{ margin: 0 }}>Password</label>
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    style={{ background: 'none', border: 'none', color: '#a5b4fc', fontSize: '12px', cursor: 'pointer' }}
                  >
                    {showPassword ? 'Hide' : 'Show'}
                  </button>
                </div>
                <input
                  id="password"
                  type={showPassword ? 'text' : 'password'}
                  className="input-field"
                  placeholder="••••••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <button type="submit" className="btn-primary" style={{ width: '100%', marginBottom: '1rem' }} disabled={loading}>
                {loading ? 'Processing...' : isRegister ? 'Register Account ➔' : 'Sign In ➔'}
              </button>

              {!isRegister && (
                <button
                  type="button"
                  className="btn-secondary"
                  style={{ width: '100%', justifyContent: 'center', marginBottom: '1rem' }}
                  onClick={fillDemoStudent}
                >
                  🔑 Auto-Fill Demo Student Credentials
                </button>
              )}

              <div style={{ textAlign: 'center', marginTop: '1rem' }}>
                <button
                  type="button"
                  onClick={() => { setIsRegister(!isRegister); setError(''); setSuccessMsg(''); }}
                  style={{ background: 'none', border: 'none', color: '#a5b4fc', fontSize: '13px', cursor: 'pointer', textDecoration: 'underline' }}
                >
                  {isRegister ? 'Already have an account? Sign In' : "Don't have an account? Register"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudentAuthApp />);
  </script>
</body>
</html>
