<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guidance Counselor Dashboard | BuddyLearnAI</title>
  <link rel="stylesheet" href="/static/guidance/app.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function GuidanceDashboard() {
      const [activeTab, setActiveTab] = useState('roster');
      const [searchTerm, setSearchTerm] = useState('');
      const [riskFilter, setRiskFilter] = useState('all');
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [interventionNote, setInterventionNote] = useState('');
      const [savedAlert, setSavedAlert] = useState(false);

      const [students, setStudents] = useState([
        { id: 'std-101', name: 'Ama Owusu', email: 'ama.owusu@ashesi.edu.gh', course: 'CS312 Algorithm Analysis', readiness: 42, streak: 2, risk: 'High Risk', weakTopic: 'Dynamic Programming' },
        { id: 'std-102', name: 'Kofi Mensah', email: 'kofi.m@ashesi.edu.gh', course: 'CS312 Algorithm Analysis', readiness: 58, streak: 4, risk: 'Medium Risk', weakTopic: 'Graph Shortest Path' },
        { id: 'std-103', name: 'Yaa Asantewaa', email: 'yaa.a@ashesi.edu.gh', course: 'MATH201 Linear Algebra', readiness: 88, streak: 14, risk: 'Low Risk', weakTopic: 'Matrix Inversion' },
        { id: 'std-104', name: 'Kwaku Duah', email: 'kwaku.d@ashesi.edu.gh', course: 'CS221 Data Structures', readiness: 36, streak: 0, risk: 'High Risk', weakTopic: 'AVL Tree Rotation' },
      ]);

      const [notes, setNotes] = useState([
        { id: 'note-1', student: 'Ama Owusu', date: '2026-03-12', topic: 'Dynamic Programming Practice', note: 'Recommended state table practice. Scheduled follow-up quiz for Friday.' }
      ]);

      const openIntervention = (student) => {
        setSelectedStudent(student);
        setInterventionNote(`Counselor Note for ${student.name}:\n- Priority review on ${student.weakTopic}.\n- Recommend 15-min daily flashcard goal.`);
        setIsDrawerOpen(true);
        setSavedAlert(false);
      };

      const saveIntervention = (e) => {
        e.preventDefault();
        setNotes([{ id: `note-${Date.now()}`, student: selectedStudent.name, date: 'Today', topic: selectedStudent.weakTopic, note: interventionNote }, ...notes]);
        setSavedAlert(true);
        setTimeout(() => setIsDrawerOpen(false), 800);
      };

      const filteredStudents = students.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              s.course.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesRisk = riskFilter === 'all' || 
                            (riskFilter === 'high' && s.risk === 'High Risk') ||
                            (riskFilter === 'med' && s.risk === 'Medium Risk') ||
                            (riskFilter === 'low' && s.risk === 'Low Risk');
        return matchesSearch && matchesRisk;
      });

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Header */}
          <header className="fb-header">
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <div style={{ width: '40px', height: '40px', borderRadius: '50%', background: '#0866ff', color: '#fff', fontWeight: 800, fontSize: '24px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                b
              </div>
              <span style={{ fontSize: '18px', fontWeight: 700, color: '#0866ff' }}>BuddyLearnAI</span>
              <span style={{ background: '#e4e6eb', fontSize: '12px', fontWeight: 600, padding: '2px 8px', borderRadius: '12px' }}>Academic Counselor</span>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <span style={{ fontSize: '13px', color: '#65676b', fontWeight: 600 }}>
                🎓 Dr. Kwame Ansah
              </span>
              <button 
                className="btn-fb-secondary"
                onClick={() => {
                  localStorage.removeItem('guidance_token');
                  window.location.href = '/guidance/login';
                }}
              >
                🔒 Log Out
              </button>
            </div>
          </header>

          <main className="guidance-layout">
            {/* Top Metrics Row */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '12px', marginBottom: '16px' }}>
              <div className="fb-card" style={{ padding: '16px' }}>
                <div style={{ fontSize: '12px', fontWeight: 600, color: '#65676b', textTransform: 'uppercase' }}>Monitored Students</div>
                <div style={{ fontSize: '26px', fontWeight: 700, margin: '4px 0' }}>{students.length}</div>
                <div style={{ fontSize: '12px', color: '#65676b' }}>Active across 3 courses</div>
              </div>

              <div className="fb-card" style={{ padding: '16px', borderLeft: '4px solid #fa383e' }}>
                <div style={{ fontSize: '12px', fontWeight: 600, color: '#65676b', textTransform: 'uppercase' }}>At-Risk Alert Count</div>
                <div style={{ fontSize: '26px', fontWeight: 700, margin: '4px 0', color: '#c5221f' }}>2</div>
                <div style={{ fontSize: '12px', color: '#c5221f' }}>Readiness score under 50%</div>
              </div>

              <div className="fb-card" style={{ padding: '16px' }}>
                <div style={{ fontSize: '12px', fontWeight: 600, color: '#65676b', textTransform: 'uppercase' }}>Class Quiz Average</div>
                <div style={{ fontSize: '26px', fontWeight: 700, margin: '4px 0', color: '#137333' }}>67.4%</div>
                <div style={{ fontSize: '12px', color: '#137333' }}>↑ +3.2% from last week</div>
              </div>

              <div className="fb-card" style={{ padding: '16px' }}>
                <div style={{ fontSize: '12px', fontWeight: 600, color: '#65676b', textTransform: 'uppercase' }}>Advising Sessions</div>
                <div style={{ fontSize: '26px', fontWeight: 700, margin: '4px 0' }}>{notes.length}</div>
                <div style={{ fontSize: '12px', color: '#65676b' }}>Completed this term</div>
              </div>
            </div>

            {/* Content Tabs */}
            <div className="fb-card" style={{ padding: 0, overflow: 'hidden' }}>
              <div style={{ display: 'flex', gap: '4px', background: '#fff', borderBottom: '1px solid #e4e6eb', padding: '4px 8px 0' }}>
                <button 
                  style={{ padding: '12px 18px', background: 'none', border: 'none', borderBottom: activeTab === 'roster' ? '3px solid #0866ff' : '3px solid transparent', color: activeTab === 'roster' ? '#0866ff' : '#65676b', fontWeight: 600, cursor: 'pointer' }}
                  onClick={() => setActiveTab('roster')}
                >
                  📊 Student Roster & Risk Tracking
                </button>

                <button 
                  style={{ padding: '12px 18px', background: 'none', border: 'none', borderBottom: activeTab === 'notes' ? '3px solid #0866ff' : '3px solid transparent', color: activeTab === 'notes' ? '#0866ff' : '#65676b', fontWeight: 600, cursor: 'pointer' }}
                  onClick={() => setActiveTab('notes')}
                >
                  📝 Counseling Session Notes
                </button>
              </div>

              {activeTab === 'roster' && (
                <div style={{ padding: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px', flexWrap: 'wrap', gap: '12px' }}>
                    <div>
                      <h2 style={{ fontSize: '16px', fontWeight: 700 }}>Student Academic Roster</h2>
                      <p style={{ fontSize: '13px', color: '#65676b' }}>Monitor readiness scores and trigger advising notes.</p>
                    </div>

                    <div style={{ display: 'flex', gap: '12px' }}>
                      <input
                        className="fb-input"
                        placeholder="Search student or course..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        style={{ width: '220px' }}
                      />

                      <select
                        className="fb-input"
                        style={{ width: '160px' }}
                        value={riskFilter}
                        onChange={(e) => setRiskFilter(e.target.value)}
                      >
                        <option value="all">All Risk Levels</option>
                        <option value="high">High Risk</option>
                        <option value="med">Medium Risk</option>
                        <option value="low">Low Risk</option>
                      </select>
                    </div>
                  </div>

                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px', textAlign: 'left' }}>
                      <thead>
                        <tr style={{ background: '#f7f8fa', borderBottom: '1px solid #e4e6eb', color: '#65676b', fontSize: '12px' }}>
                          <th style={{ padding: '12px 16px' }}>Student Name</th>
                          <th style={{ padding: '12px 16px' }}>Course</th>
                          <th style={{ padding: '12px 16px' }}>Readiness Score</th>
                          <th style={{ padding: '12px 16px' }}>Stumbling Topic</th>
                          <th style={{ padding: '12px 16px' }}>Risk Level</th>
                          <th style={{ padding: '12px 16px' }}>Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredStudents.map(s => (
                          <tr key={s.id} style={{ borderBottom: '1px solid #e4e6eb' }}>
                            <td style={{ padding: '12px 16px' }}><strong>{s.name}</strong></td>
                            <td style={{ padding: '12px 16px', color: '#65676b' }}>{s.course}</td>
                            <td style={{ padding: '12px 16px', fontWeight: 700, color: s.readiness < 50 ? '#c5221f' : '#137333' }}>{s.readiness}%</td>
                            <td style={{ padding: '12px 16px', color: '#0866ff' }}>{s.weakTopic}</td>
                            <td style={{ padding: '12px 16px' }}>
                              <span className={`badge-risk ${s.risk === 'High Risk' ? 'high' : s.risk === 'Medium Risk' ? 'medium' : 'low'}`}>
                                {s.risk}
                              </span>
                            </td>
                            <td style={{ padding: '12px 16px' }}>
                              <button
                                className="btn-fb-secondary"
                                style={{ padding: '4px 10px', fontSize: '12px' }}
                                onClick={() => openIntervention(s)}
                              >
                                💡 Send Advice
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeTab === 'notes' && (
                <div style={{ padding: '16px' }}>
                  <h2 style={{ fontSize: '16px', fontWeight: 700, marginBottom: '16px' }}>Advising Session Logs</h2>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    {notes.map(n => (
                      <div key={n.id} className="fb-card" style={{ padding: '14px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                          <strong style={{ color: '#0866ff' }}>👤 {n.student}</strong>
                          <span style={{ fontSize: '12px', color: '#65676b' }}>📅 {n.date}</span>
                        </div>
                        <p style={{ fontSize: '13px', color: '#050505' }}>{n.note}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* Intervention Drawer */}
          {isDrawerOpen && selectedStudent && (
            <div style={{ position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', background: 'rgba(0,0,0,0.5)', display: 'flex', justifyContent: 'flex-end', zIndex: 1000 }}>
              <div style={{ width: '100%', maxWidth: '480px', height: '100vh', background: '#fff', padding: '20px', overflowY: 'auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '16px', fontWeight: 700 }}>Record Academic Advice</h3>
                  <button className="btn-fb-secondary" onClick={() => setIsDrawerOpen(false)}>✕ Close</button>
                </div>

                <div className="fb-card" style={{ padding: '12px', marginBottom: '16px', background: '#f7f8fa' }}>
                  <strong>{selectedStudent.name}</strong>
                  <div style={{ fontSize: '13px', color: '#65676b' }}>Course: {selectedStudent.course} • Weakness: {selectedStudent.weakTopic}</div>
                </div>

                {savedAlert && (
                  <div style={{ padding: '10px', background: '#e6f4ea', color: '#137333', borderRadius: '6px', fontSize: '13px', marginBottom: '14px' }}>
                    ✔ Advice saved and sent to student!
                  </div>
                )}

                <form onSubmit={saveIntervention}>
                  <div style={{ marginBottom: '16px' }}>
                    <label style={{ fontSize: '13px', fontWeight: 600, display: 'block', marginBottom: '6px' }}>Advising Plan</label>
                    <textarea
                      className="fb-input"
                      style={{ minHeight: '160px', fontFamily: 'inherit' }}
                      value={interventionNote}
                      onChange={(e) => setInterventionNote(e.target.value)}
                      required
                    ></textarea>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px' }}>
                    <button type="button" className="btn-fb-secondary" onClick={() => setIsDrawerOpen(false)}>Cancel</button>
                    <button type="submit" className="btn-fb-primary">Save Advice</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GuidanceDashboard />);
  </script>
</body>
</html>
