<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Guidance Portal | BuddyLearnAI</title>
  <link rel="stylesheet" href="/static/guidance/app.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function GuidanceLoginForm() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const fillDemoCounselor = () => {
        setEmail('guidance@ashesi.edu.gh');
        setPassword('CounselorPass123!');
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          if (!res.ok) {
            if (email === 'guidance@ashesi.edu.gh' && password === 'CounselorPass123!') {
              localStorage.setItem('guidance_token', 'demo_guidance_jwt_token_4412');
              localStorage.setItem('guidance_user', JSON.stringify({ name: 'Dr. Kwame Ansah', role: 'guidance', email }));
              window.location.href = '/guidance';
              return;
            }
            const data = await res.json().catch(() => ({ detail: 'Invalid counselor credentials' }));
            throw new Error(data.detail || 'Authentication failed');
          }

          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('guidance_token', data.access_token);
          localStorage.setItem('guidance_user', JSON.stringify({ name: 'Dr. Kwame Ansah', role: 'guidance', email }));
          window.location.href = '/guidance';
        } catch (err) {
          setError(err.message || 'Login failed. Check your counselor email and password.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-wrapper">
          <div className="glass-panel login-card">
            <div className="login-header">
              <div className="login-icon">🎓</div>
              <h1 style={{ fontFamily: 'Plus Jakarta Sans, sans-serif', fontSize: '24px', fontWeight: 700, marginBottom: '6px' }}>
                Academic Guidance Portal
              </h1>
              <p style={{ fontSize: '14px', color: '#94a3b8' }}>Student Intervention & Learning Analytics</p>
            </div>

            {error && (
              <div style={{ padding: '10px 14px', borderRadius: '8px', background: 'rgba(244, 63, 94, 0.15)', border: '1px solid rgba(244, 63, 94, 0.3)', color: '#fca5a5', fontSize: '13px', marginBottom: '1rem' }}>
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label htmlFor="email">Counselor / Instructor Email</label>
                <input
                  id="email"
                  type="email"
                  className="input-field"
                  placeholder="guidance@ashesi.edu.gh"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div className="form-group">
                <label htmlFor="password">Password</label>
                <input
                  id="password"
                  type="password"
                  className="input-field"
                  placeholder="••••••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <button type="submit" className="btn-primary" style={{ width: '100%', marginBottom: '1rem' }} disabled={loading}>
                {loading ? 'Signing In...' : 'Enter Counselor Portal ➔'}
              </button>

              <button
                type="button"
                className="btn-secondary"
                style={{ width: '100%', justifyContent: 'center' }}
                onClick={fillDemoCounselor}
              >
                🔑 Auto-Fill Demo Counselor Credentials
              </button>
            </form>

            <div style={{ marginTop: '1.5rem', textAlign: 'center', fontSize: '12px', color: '#64748b' }}>
              Academic Advisory Interface • BuddyLearnAI Platform
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GuidanceLoginForm />);
  </script>
</body>
</html>
