<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counselor Login | Academic Guidance Portal</title>
  <link rel="stylesheet" href="/static/guidance/app.css">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function GuidanceLoginForm() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const fillDemoCounselor = () => {
        setEmail('guidance@ashesi.edu.gh');
        setPassword('CounselorPass123!');
        setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          if (!res.ok) {
            if (email === 'guidance@ashesi.edu.gh' && password === 'CounselorPass123!') {
              localStorage.setItem('guidance_token', 'demo_guidance_jwt_token_4412');
              localStorage.setItem('guidance_user', JSON.stringify({ name: 'Dr. Kwame Ansah', role: 'guidance', email }));
              window.location.href = '/guidance';
              return;
            }
            const data = await res.json().catch(() => ({ detail: 'Invalid counselor credentials' }));
            throw new Error(data.detail || 'Authentication failed');
          }

          const data = await res.json();
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('guidance_token', data.access_token);
          localStorage.setItem('guidance_user', JSON.stringify({ name: 'Dr. Kwame Ansah', role: 'guidance', email }));
          window.location.href = '/guidance';
        } catch (err) {
          setError(err.message || 'Login failed. Check counselor email and password.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="login-bg">
          <div style={{ textAlign: 'center', marginBottom: '24px' }}>
            <h1 style={{ fontSize: '32px', fontWeight: 800, color: '#0866ff', letterSpacing: '-0.5px' }}>
              BuddyLearnAI
            </h1>
            <p style={{ fontSize: '15px', color: '#65676b' }}>Academic Counselor & Advisor Portal</p>
          </div>

          <div className="fb-card" style={{ width: '100%', maxWidth: '396px', padding: '20px' }}>
            {error && (
              <div style={{ padding: '10px 12px', background: '#fde8e8', border: '1px solid #f8b4b4', color: '#9b1c1c', borderRadius: '6px', fontSize: '13px', marginBottom: '14px' }}>
                ⚠️ {error}
              </div>
            )}

            <form onSubmit={handleSubmit}>
              <div style={{ marginBottom: '12px' }}>
                <input
                  type="email"
                  className="fb-input"
                  placeholder="Counselor Email Address"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  required
                />
              </div>

              <div style={{ marginBottom: '14px' }}>
                <input
                  type="password"
                  className="fb-input"
                  placeholder="Password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  required
                />
              </div>

              <button
                type="submit"
                className="btn-fb-primary"
                style={{ width: '100%', padding: '12px', fontSize: '16px', marginBottom: '12px' }}
                disabled={loading}
              >
                {loading ? 'Signing In...' : 'Log In as Counselor'}
              </button>

              <hr style={{ border: 'none', borderTop: '1px solid #e4e6eb', margin: '14px 0' }} />

              <button
                type="button"
                className="btn-fb-secondary"
                style={{ width: '100%', padding: '10px', fontSize: '14px', justifyContent: 'center' }}
                onClick={fillDemoCounselor}
              >
                🔑 Auto-Fill Demo Counselor Credentials
              </button>
            </form>
          </div>

          <div style={{ marginTop: '20px', fontSize: '12px', color: '#8a8d91', textAlign: 'center' }}>
            Academic Intervention & Student Guidance Portal
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GuidanceLoginForm />);
  </script>
</body>
</html>
